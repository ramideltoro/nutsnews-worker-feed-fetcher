name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "24 5 * * 2"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Detect analyzable source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          has_code=false
          while IFS= read -r file; do
            case "$file" in
              ./.git/*|./node_modules/*|./dist/*) continue ;;
              *.js|*.jsx|*.ts|*.tsx)
                has_code=true
                break
                ;;
            esac
          done < <(find . -type f)

          echo "has_code=$has_code" >> "$GITHUB_OUTPUT"

      - name: Skip until source exists
        if: steps.source.outputs.has_code != 'true'
        run: echo "No JavaScript or TypeScript source files are present yet."

      - name: Initialize CodeQL
        if: steps.source.outputs.has_code == 'true'
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
        with:
          languages: ${{ matrix.language }}

      - name: Setup Node.js
        if: steps.source.outputs.has_code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@ramideltoro"

      - name: Install dependencies
        if: steps.source.outputs.has_code == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Build
        if: steps.source.outputs.has_code == 'true'
        run: npm run build

      - name: Analyze
        if: steps.source.outputs.has_code == 'true'
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
